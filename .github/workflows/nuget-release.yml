name: Release PdfCarton to NuGet

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and prepare PdfCarton
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PDFCARTON_RELEASE_REDUCED_TESTS: "1"
    steps:
      - name: Require the PdfCarton master branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "NuGet releases must run from master, not $GITHUB_REF."
            exit 1
          fi

      - name: Check out the triggering PdfCarton commit
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run reduced PdfCarton release verification
        shell: bash
        run: eng/verify-release.sh

      - name: Pack and validate PdfCarton release packages
        shell: bash
        run: eng/pack-release.sh release-artifacts

      - name: Create the package checksum list
        shell: bash
        working-directory: release-artifacts
        run: |
          shopt -s nullglob
          io_packages=(DripSharp.PdfCarton.IO.*.nupkg DripSharp.PdfCarton.IO.*.snupkg)
          fonts_packages=(DripSharp.PdfCarton.Fonts.*.nupkg DripSharp.PdfCarton.Fonts.*.snupkg)
          xmp_packages=(DripSharp.PdfCarton.Xmp.*.nupkg DripSharp.PdfCarton.Xmp.*.snupkg)
          pdfcarton_packages=(DripSharp.PdfCarton.[0-9]*.nupkg DripSharp.PdfCarton.[0-9]*.snupkg)
          preflight_packages=(DripSharp.PdfCarton.Preflight.*.nupkg DripSharp.PdfCarton.Preflight.*.snupkg)
          packages=(
            "${io_packages[@]}"
            "${fonts_packages[@]}"
            "${xmp_packages[@]}"
            "${pdfcarton_packages[@]}"
            "${preflight_packages[@]}"
          )

          if (( ${#io_packages[@]} != 2 ||
                ${#fonts_packages[@]} != 2 ||
                ${#xmp_packages[@]} != 2 ||
                ${#pdfcarton_packages[@]} != 2 ||
                ${#preflight_packages[@]} != 2 )); then
            echo "Expected one package and one symbol package for each PdfCarton project."
            exit 1
          fi
          if (( $(find . -mindepth 1 -maxdepth 1 -type f | wc -l) != 10 )); then
            echo "The release artifact directory contains unexpected files."
            exit 1
          fi

          printf '%s\0' "${packages[@]}" \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Retain the tested PdfCarton release packages
        uses: actions/upload-artifact@v4
        with:
          name: pdfcarton-nuget-release
          path: |
            release-artifacts/*.nupkg
            release-artifacts/*.snupkg
            release-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
