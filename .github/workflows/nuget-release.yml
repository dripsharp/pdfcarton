name: Release PdfCarton to NuGet

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare an artifact, or publish the exact Windows-verified prepare artifact
        type: choice
        options: [prepare, publish]
        default: prepare
        required: true
      package_checksums_sha256:
        description: SHA256 of the exact Windows-tested artifact checksum list
        type: string
        required: false
      prepare_run_id:
        description: Successful prepare-only run verified on Windows by the source repository release command
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: nuget-release
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.mode == 'prepare'
    name: Build and prepare PdfCarton
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PDFCARTON_RELEASE_REDUCED_TESTS: "1"
      RepositoryCommit: ${{ github.sha }}
      SourceRevisionId: ${{ github.sha }}
    steps:
      - name: Require the PdfCarton master branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "NuGet releases must run from master, not $GITHUB_REF."
            exit 1
          fi

      - name: Check out the triggering PdfCarton commit
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run reduced PdfCarton release verification
        shell: bash
        run: eng/verify-release.sh

      - name: Pack and validate PdfCarton release packages
        shell: bash
        run: eng/pack-release.sh release-artifacts

      - name: Create the package checksum list
        shell: bash
        working-directory: release-artifacts
        run: |
          shopt -s nullglob
          packages=(DripSharp.PdfCarton.[0-9]*.nupkg DripSharp.PdfCarton.[0-9]*.snupkg)

          if (( ${#packages[@]} != 2 )); then
            echo "Expected the one public PdfCarton package and its symbol package."
            exit 1
          fi
          if (( $(find . -mindepth 1 -maxdepth 1 -type f | wc -l) != 2 )); then
            echo "The release artifact directory contains unexpected files."
            exit 1
          fi

          printf '%s\0' "${packages[@]}" \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS

      - name: Retain the tested PdfCarton release packages
        uses: actions/upload-artifact@v4
        with:
          name: pdfcarton-nuget-release
          path: |
            release-artifacts/*.nupkg
            release-artifacts/*.snupkg
            release-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish PdfCarton to nuget.org
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Require an exact successful prepare-only run
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master ]]
          [[ "$PREPARE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARE_RUN_ID" > /tmp/prepare-run.json
          jq -e --arg sha "$EXPECTED_SHA" '
            .status == "completed" and .conclusion == "success" and
            .event == "workflow_dispatch" and .head_branch == "master" and
            .head_sha == $sha and .path == ".github/workflows/nuget-release.yml"
          ' /tmp/prepare-run.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARE_RUN_ID/jobs" \
            | jq -s -e '[.[].jobs[]] |
                any(.name == "Build and prepare PdfCarton" and .conclusion == "success") and
                any(.name == "Publish PdfCarton to nuget.org" and .conclusion == "skipped")'

      - name: Download the tested PdfCarton release packages
        uses: actions/download-artifact@v4
        with:
          name: pdfcarton-nuget-release
          path: release-artifacts
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}

      - name: Verify the tested PdfCarton release packages
        id: packages
        env:
          EXPECTED_CHECKSUMS_SHA256: ${{ inputs.package_checksums_sha256 }}
        shell: bash
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CHECKSUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "$EXPECTED_CHECKSUMS_SHA256  SHA256SUMS" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS

          shopt -s nullglob
          pdfcarton_packages=(DripSharp.PdfCarton.[0-9]*.nupkg)
          symbol_packages=(DripSharp.PdfCarton.[0-9]*.snupkg)

          if (( ${#pdfcarton_packages[@]} != 1 ||
                ${#symbol_packages[@]} != 1 )); then
            echo "Expected the one public PdfCarton package and its symbol package."
            exit 1
          fi
          if (( $(find . -mindepth 1 -maxdepth 1 -type f | wc -l) != 3 )); then
            echo "The downloaded release artifact contains unexpected files."
            exit 1
          fi

          printf 'pdfcarton=%s\n' "${pdfcarton_packages[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Recheck immutable version before publication
        shell: bash
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          version=$(python3 - <<'PYCODE'
          import glob, xml.etree.ElementTree as ET, zipfile
          with zipfile.ZipFile(glob.glob('*.nupkg')[0]) as package:
              manifest = next(name for name in package.namelist() if name.endswith('.nuspec'))
              print(ET.fromstring(package.read(manifest)).findtext('{*}metadata/{*}version'))
          PYCODE
          )
          status=$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' \
            "https://api.nuget.org/v3-flatcontainer/dripsharp.pdfcarton/$version/dripsharp.pdfcarton.$version.nupkg")
          [[ "$status" == 404 ]] || { echo "Version unavailable or availability unknown (HTTP $status)"; exit 1; }

      - name: Obtain a short-lived NuGet API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: isaksky

      - name: Publish the PdfCarton bundle
        shell: bash
        working-directory: release-artifacts
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "${{ steps.packages.outputs.pdfcarton }}" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
